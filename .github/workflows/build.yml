name: Build blog

on:
  schedule:
    # Every 6 hours — picks up new devlog entries from source repos.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "build.mjs"
      - "projects.json"
      - "style.css"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate index.html from project devlogs
        run: node build.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- index.html; then
            git add index.html
            git commit -m "chore: sync blog from project devlogs"
            git push
          else
            echo "No changes to index.html"
          fi
